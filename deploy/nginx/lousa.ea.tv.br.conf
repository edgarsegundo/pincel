# ================================================================
# REFERÊNCIA para sites/lousa.ea.tv.br.conf (projeto reverse-proxy-config).
# Se o seu arquivo já existe, confira estes pontos que o Pincel exige:
#   1. root /var/www/lousa.ea.tv.br  (e o bind mount no docker-compose do nginx)
#   2. index.html e sw.js NUNCA em cache (senão o PWA fica preso na versão antiga)
#   3. location = /api/shape  ->  container pincel_proxy:8787 (proxy do JEV)
#   4. X-Forwarded-For SUBSTITUÍDO por $remote_addr (o proxy usa o último valor para o limite por IP)
# ================================================================

# HTTP – desafio ACME e redirecionamento para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lousa.ea.tv.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://lousa.ea.tv.br$request_uri;
    }
}

# HTTPS – app estático (PWA) + proxy da IA
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;  # sem reuseport: só um site pode declará-lo (app.empregoaqui.com.br já declara)
    listen [::]:443 quic;
    http2 on;
    http3 on;

    server_name lousa.ea.tv.br;

    root /var/www/lousa.ea.tv.br;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/lousa.ea.tv.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lousa.ea.tv.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # add_header dentro de uma location substitui os do nível server, por isso os cabeçalhos
    # de segurança se repetem em cada bloco (mesmo padrão do app.empregoaqui.com.br).

    # Documento principal e service worker: nunca do cache do navegador. O Workbox só detecta a
    # versão nova se sw.js vier fresco; registerSW.js é o carregador dele.
    location ~ ^/(index\.html|sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Arquivos com hash no nome (JS, CSS, fonte): cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        try_files $uri =404;
    }

    # Proxy da IA (JEV). A resolução do nome é adiada de propósito: se o container estiver parado,
    # só este endereço responde 502 e o nginx continua subindo com todos os sites.
    location = /api/shape {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        access_log off;

        resolver 127.0.0.11 valid=10s;
        set $pincel_proxy http://pincel_proxy:8787;
        proxy_pass $pincel_proxy$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Troca o cabeçalho (não acrescenta): o que o visitante mandar nele é descartado.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # Resto do app (ícones, etc.): cache curto.
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    access_log /var/log/nginx/lousa_access.log;
    error_log  /var/log/nginx/lousa_error.log warn;
}
